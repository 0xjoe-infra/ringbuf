name: Systems Quality & Zero-Alloc CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: Engine Hardening & Race Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Sanitize Hidden Unicode & Auto-Fix Signatures
        run: |
          find . -name "*.go" -type f -exec sed -i 's/\xe2\x80\x8b//g' {} +
          sed -i 's/(t testing\.T)/(t *testing.T)/g' audio_telemetry_test.go
          gofmt -w .

      - name: Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Race Detection & Concurrency Suite (amd64)
        run: |
          go test -race -v -count=1 ./...

      - name: 32-bit Architecture & Atomic Alignment Check (386)
        run: |
          GOARCH=386 go test -v -count=1 ./...

      - name: Compiler Escape Analysis (-gcflags="-m")
        run: |
          go build -gcflags="-m" ./... 2>&1 | tee escape.txt
          grep "hdr" escape.txt || true

      - name: Sustained Eviction Benchmark
        run: |
          go test -bench=. -benchmem -count=1 ./...
