name: Zero-Alloc CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Race Detector & Zero-Alloc Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Module Dependencies
        run: go mod tidy

      - name: Static Analysis & Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout=2m ./...

      - name: Run Zero-Alloc Benchmarks
        run: go test -v -run=^$ -bench=BenchmarkAudioStream_ZeroAllocSustainedEviction -benchmem ./...
